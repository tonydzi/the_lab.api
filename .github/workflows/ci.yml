name: CI

# Verify-only: runs the same build as the release channels (build.yml) without
# publishing, so a change that breaks the dashboard build or drops it out of the
# wheel fails on the PR instead of at release time.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      # Distinguishable in logs; never published.
      version: 0.0.0.dev0

  # The MCP bridge is launched with a bare `python3` from PATH, not the
  # interpreter the-lab is installed in (on macOS that is 3.9), so check that it
  # still starts and lists tools under the oldest and a current Python.
  mcp-bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bridge-python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - id: bridge
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.bridge-python }}

      # The test itself imports the app to get the real OpenAPI spec (>= 3.10).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: MCP bridge serves tools
        env:
          LAB_MCP_PYTHON: ${{ steps.bridge.outputs.python-path }}
        run: python -m unittest -v tests.test_mcp_bridge
